# Fallback metadata for older setuptools/pip (e.g. the Python bundled with
# Xcode Command Line Tools). pyproject.toml is the source of truth; keep in
# sync when bumping the version.

[metadata]
name = image-luminescence
version = 1.0.0
description = Make images glow on HDR displays: Ultra HDR gain-map JPEGs and Rec.2020 PQ PNGs, colors preserved exactly
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Katy Solovewicz
url = https://github.com/kwicz/image-luminescence

[options]
py_modules =
    luminescence
    luminescence_pq
    luminescence_icc
python_requires = >=3.9
install_requires =
    numpy

[options.entry_points]
console_scripts =
    luminesce = luminescence:main
    luminesce-pq = luminescence_pq:main
